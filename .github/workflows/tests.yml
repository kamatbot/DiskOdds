name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record source provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD > validated-commit.txt
          git rev-parse 'HEAD^{tree}' > validated-tree.txt
          git archive --format=zip --output=DiskOdds-source.zip HEAD
      - name: Preserve reviewed source independently of build outcome
        uses: actions/upload-artifact@v7
        with:
          name: review-source
          path: |
            DiskOdds-source.zip
            validated-commit.txt
            validated-tree.txt
          retention-days: 14
      - name: Core tests through Swift Package Manager
        run: |
          set -euo pipefail
          swift test 2>&1 | tee core-tests.log
      - name: Build app and run shared Xcode test plan
        run: |
          set -euo pipefail
          xcodebuild test -project Radix.xcodeproj -scheme Radix \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/xcode-derived-data \
            -resultBundlePath .build/Tests.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode-tests.log
      - name: Build optimized Apple Silicon app
        run: |
          set -euo pipefail
          xcodebuild build -project Radix.xcodeproj -scheme Radix \
            -configuration Release -destination 'platform=macOS' -arch arm64 \
            -derivedDataPath .build/xcode-release CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO 2>&1 | tee release-build.log
      - name: Sign developer bundle and verify ZIP round trip
        run: |
          set -euo pipefail
          python3 scripts/package-reviewed-app.py \
            .build/xcode-release/Build/Products/Release/DiskOdds.app \
            2>&1 | tee package-validation.log
      - name: Preserve test results and build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            .build/Tests.xcresult
            core-tests.log
            xcode-tests.log
            release-build.log
            package-validation.log
            smoke-launch.log
            smoke-result.json
            diskodds-preview.png
            DiskOdds-macOS-arm64-dev.zip
            DiskOdds-source.zip
            build-metadata.json
            SHA256SUMS.txt
            validated-commit.txt
            validated-tree.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
