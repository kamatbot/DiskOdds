name: Configure and validate DiskOdds
on:
  push:
    branches: [feat/vibecoder-cleanup]
    paths: [scripts/configure-diskodds.py, scripts/diskodds-ui-translations.json, .github/workflows/configure-diskodds.yml]
permissions:
  contents: write
concurrency:
  group: configure-diskodds
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'kamatbot/DiskOdds'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/vibecoder-cleanup
      - name: Apply integration updates and commit generated configuration
        run: |
          set -euo pipefail
          python3 scripts/configure-diskodds.py
          git config user.name DiskOdds
          git config user.email 289325931+kamatbot@users.noreply.github.com
          git add Radix/Localizable.xcstrings RadixCoreTests/LocalizationCatalogTests.swift \
            Radix/DeveloperCleanup/Core/CleanupExecutor.swift Radix/DeveloperCleanup/Core/CleanupFileSystem.swift README.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: complete localization and package audits and protect active app builds'
            git push origin HEAD:feat/vibecoder-cleanup
          fi
      - name: Run all core tests with strict failure propagation
        run: |
          set -euo pipefail
          swift test 2>&1 | tee core-tests.log
      - name: Build native application
        run: |
          set -euo pipefail
          xcodebuild -project Radix.xcodeproj -scheme Radix -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/xcode-derived-data \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee app-build.log
      - name: Capture full-window non-destructive preview
        continue-on-error: true
        run: |
          set -euo pipefail
          app="$PWD/.build/xcode-derived-data/Build/Products/Debug/DiskOdds.app"
          open -n "$app" --args --diskodds-demo
          sleep 8
          window=$(swift -e 'import CoreGraphics; let windows = CGWindowListCopyWindowInfo(.optionAll, kCGNullWindowID) as? [[String: Any]] ?? []; for w in windows where w[kCGWindowOwnerName as String] as? String == "DiskOdds" && w[kCGWindowLayer as String] as? Int == 0 { if let id = w[kCGWindowNumber as String] { print(id); break } }')
          test -n "$window"
          screencapture -x -o -l "$window" diskodds-preview.png
      - name: Package unsigned Apple Silicon developer build
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/xcode-derived-data/Build/Products/Debug/DiskOdds.app DiskOdds-macOS-arm64-unsigned.zip
          git rev-parse HEAD > validated-commit.txt
          git archive --format=zip --output=DiskOdds-source.zip HEAD
      - name: Preserve logs and preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diskodds-validation
          path: |
            core-tests.log
            app-build.log
            diskodds-preview.png
            validated-commit.txt
            DiskOdds-macOS-arm64-unsigned.zip
            DiskOdds-source.zip
          retention-days: 7
